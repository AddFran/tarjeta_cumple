<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tarjeta-3d</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        canvas {
            display: block;
        }
        #interaction-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            display: flex;
            flex-direction: column;
            align-items: center;

            pointer-events: none;
            z-index: 1000;
        }

        #crosshair {
            width: 6px;
            height: 6px;

            background: white;
            border: 1px solid black;
            border-radius: 50%;

            transition: all 0.15s ease;
        }

        #object-name {
            margin-top: 14px;

            color: white;
            font-family: Arial, sans-serif;
            font-size: 12px;
            letter-spacing: 1px;

            text-shadow: 0 1px 4px black;

            opacity: 0;
            transition: opacity 0.15s ease;
        }

        /* Cuando apuntamos a un objeto */
        #interaction-indicator.active #crosshair {
            width: 16px;
            height: 16px;

            background: transparent;
            border: 2px solid #64D8FF;
        }

        #interaction-indicator.active #object-name {
            opacity: 1;
        }

        /* =====================================
          INTERFAZ DE INSPECCIÓN
        ===================================== */

        #inspection-ui {

            position: fixed;

            left: 50%;
            bottom: 8%;

            transform: translateX(-50%);

            width: min(500px, 80%);

            text-align: center;

            color: white;
            font-family: Arial, sans-serif;

            pointer-events: none;

            opacity: 0;

            transition: opacity 0.3s ease;

            z-index: 1001;

        }

        #inspection-ui.active {
            opacity: 1;
        }

        #inspection-title {

            font-size: 24px;
            margin-bottom: 10px;

            text-shadow: 0 2px 5px black;

        }

        #inspection-description {

            font-size: 14px;
            line-height: 1.6;

            text-shadow: 0 2px 5px black;

        }

        .inspection-hint {

            margin-top: 20px;

            font-size: 11px;
            color: #cccccc;

            letter-spacing: 1px;

        }

    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="interaction-indicator">
      <div id="crosshair"></div>
      <span id="object-name"></span>
    </div>

    <div id="inspection-ui">
      <h2 id="inspection-title"></h2>
      <p id="inspection-description"></p>
      <p class="inspection-hint">
        Mueve el mouse para inspeccionar
        <br>
        Presiona ESC para regresar
      </p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
